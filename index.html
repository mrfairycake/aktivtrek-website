<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Aktivtrek is coming soon. Guided walking, mountain days, navigation training and mountain skills courses across the UK.">
<title>Aktivtrek | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--text:#fff;--field:rgba(10,16,18,.48);--line:rgba(255,255,255,.28);--accent:#38565b;--accent-hover:#466a70;--form-width:578px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101719}body{font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--text)}.hero{min-height:100svh;position:relative;display:grid;align-items:center;background:#101719 url('hero.jpg') center/cover no-repeat;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,10,12,.90) 0%,rgba(4,10,12,.80) 29%,rgba(4,10,12,.48) 52%,rgba(4,10,12,.10) 100%)}.content{position:relative;width:min(100%,1536px);padding:88px 0 74px 88px}.logo{width:548px;max-width:44vw;margin:0 0 70px}.logo img{display:block;width:100%;height:auto}.copy,.signup{width:var(--form-width);max-width:calc(100vw - 176px)}h1{margin:0;font-size:64px;font-weight:700;line-height:1.03;letter-spacing:-.035em;max-width:12ch}.lead,.intro{margin:0;font-size:20px;font-weight:400;line-height:1.55;letter-spacing:-.005em}.lead{margin-top:30px}.intro{margin-top:22px}.signup{margin-top:30px;display:grid;gap:14px}.field{position:relative}.field svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:rgba(255,255,255,.80);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}input,button{font-family:inherit;width:100%;border-radius:5px}input{height:58px;padding:0 18px 0 60px;border:1px solid var(--line);background:var(--field);color:white;font-size:16px;outline:none;backdrop-filter:blur(5px)}input::placeholder{color:rgba(255,255,255,.70)}input:focus{border-color:rgba(135,173,178,.85);box-shadow:0 0 0 2px rgba(56,86,91,.28)}button{height:58px;margin-top:6px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;cursor:pointer}button:hover{background:var(--accent-hover)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1100px){.content{padding:60px 54px 52px}.logo{width:430px;max-width:52vw;margin-bottom:54px}.copy,.signup{max-width:610px}h1{font-size:54px}.lead,.intro{font-size:19px}}@media(max-width:760px){.hero{align-items:end;background-position:66% center}.hero:before{background:linear-gradient(0deg,rgba(4,10,12,.96) 0%,rgba(4,10,12,.84) 47%,rgba(4,10,12,.42) 76%,rgba(4,10,12,.14) 100%)}.content{width:100%;padding:28px 22px 24px}.logo{width:min(72vw,330px);max-width:none;margin-bottom:30px}.copy,.signup{width:100%;max-width:100%}h1{font-size:clamp(42px,11vw,54px);line-height:1.02;max-width:10ch}.lead,.intro{font-size:17px;line-height:1.45}.lead{margin-top:22px}.intro{margin-top:17px}.signup{margin-top:22px;gap:11px}input,button{height:56px}input{padding-left:57px}.field svg{left:19px;width:21px;height:21px}button{font-size:15px;margin-top:3px}.desktop-break{display:none}}
</style>
</head>
<body>
<main class="hero">
<section class="content">
<div class="logo"><img src="aktivtrek-logo.svg" alt="Aktivtrek"></div>
<div class="copy">
<h1>Aktivtrek is<br>coming soon</h1>
<p class="lead">Guided walking, mountain days, navigation training<br class="desktop-break"> and mountain skills courses across the UK.</p>
<p class="intro">Join the mailing list to hear about new courses,<br class="desktop-break"> guided days and upcoming adventures.</p>
</div>
<form class="signup" onsubmit="event.preventDefault()">
<label class="field"><span class="sr-only">Name</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4.1 2.8-7 7-7s7 2.9 7 7"/></svg><input type="text" placeholder="Name" autocomplete="name"></label>
<label class="field"><span class="sr-only">Email address</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><input type="email" placeholder="Email address" autocomplete="email"></label>
<button type="submit">Keep me updated</button>
</form>
</section>
</main>
</body>
</html>
